<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Smart Market Watchlist architecture</title>
<desc>Browser frontend talks to a FastAPI backend over REST with JWT auth. The backend reads and writes PostgreSQL for durable storage and Redis for hot-path price reads. A separate APScheduler background job polls Yahoo Finance in two batched requests per cycle regardless of watchlist size, then writes fresh snapshots into both PostgreSQL and Redis.</desc>

<rect width="760" height="560" fill="#ffffff"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Connectors (drawn first so boxes sit on top of line ends) -->
<line x1="380" y1="94" x2="380" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="392" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">REST + JWT bearer token</text>

<line x1="330" y1="214" x2="222" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="200" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">reads / writes</text>

<line x1="430" y1="214" x2="548" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="498" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">cache reads</text>

<line x1="215" y1="458" x2="215" y2="376" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="223" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">writes snapshots</text>

<line x1="320" y1="472" x2="548" y2="376" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410" y="430" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">writes cache</text>

<line x1="320" y1="492" x2="450" y2="492" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="335" y="482" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">2 requests / cycle</text>

<!-- Frontend -->
<rect x="280" y="30" width="200" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="380" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0C447C">Browser frontend</text>
<text x="380" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">Vanilla HTML / JS</text>

<!-- Backend -->
<rect x="280" y="150" width="200" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="380" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#3C3489">FastAPI backend</text>
<text x="380" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#534AB7">Auth &#183; REST API</text>

<!-- Postgres -->
<rect x="110" y="310" width="210" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="215" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#04342C">PostgreSQL</text>
<text x="215" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">Durable storage</text>

<!-- Redis -->
<rect x="450" y="310" width="210" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="555" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#04342C">Redis</text>
<text x="555" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">Hot-path cache</text>

<!-- Scheduler -->
<rect x="110" y="460" width="210" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="215" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2C2C2A">APScheduler</text>
<text x="215" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Polls every 60s</text>

<!-- Yahoo Finance -->
<rect x="450" y="460" width="210" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="555" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#4A1B0C">Yahoo Finance</text>
<text x="555" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#993C1D">External data provider</text>

</svg>
